        :root { --gold: #d4af37; --dark: #121212; --card: #1e1e1e; --text: #e0e0e0; }
        body { font-family: 'PingFang TC', sans-serif; background: var(--dark); color: var(--text); margin: 0; padding: 20px; line-height: 1.6; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { text-align: center; padding: 40px 0; border-bottom: 1px solid #333; margin-bottom: 30px; }
        h1 { color: var(--gold); letter-spacing: 2px; margin: 0; }
        .subtitle { color: #888; margin-top: 10px; }

        /* 篩選區 */
        .filter-panel { background: var(--card); padding: 25px; border-radius: 15px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; border: 1px solid #333; }
        .filter-group label { display: block; color: var(--gold); font-size: 0.9rem; margin-bottom: 8px; font-weight: bold; }
        select, input { width: 100%; padding: 12px; background: #2c2c2c; border: 1px solid #444; color: #fff; border-radius: 8px; outline: none; }
        input:focus { border-color: var(--gold); }

        /* 酒吧列表 */
        .bar-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .bar-card { background: var(--card); border-radius: 12px; padding: 20px; border: 1px solid #2c2c2c; transition: 0.3s; position: relative; display: flex; flex-direction: column; }
        .bar-card:hover { transform: translateY(-5px); border-color: var(--gold); box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        
        .special-badge { position: absolute; top: 15px; right: 15px; background: var(--gold); color: #000; font-size: 0.7rem; padding: 3px 8px; border-radius: 4px; font-weight: bold; }
        .bar-name { font-size: 1.25rem; font-weight: bold; color: var(--gold); margin-right: 40px; }
        .bar-info { font-size: 0.85rem; color: #aaa; margin: 8px 0; }
        .bar-tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
        .tag { background: #333; color: #ccc; font-size: 0.75rem; padding: 3px 10px; border-radius: 20px; }
        .tag-highlight { background: #4a3700; color: #ffcc00; }
        .bar-note { font-size: 0.9rem; color: #bbb; border-top: 1px solid #333; padding-top: 12px; margin-top: auto; }
        
        .result-count { margin-bottom: 20px; color: #888; font-size: 0.9rem; }
        @media (max-width: 600px) { .filter-panel { grid-template-columns: 1fr; } }

    const grid = document.getElementById('barGrid');
    const countDisplay = document.getElementById('resultCount');

    function update() {
        const r = document.getElementById('regionFilter').value;
        const p = document.getElementById('purposeFilter').value;
        const t = document.getElementById('typeFilter').value;
        const q = document.getElementById('searchInput').value.toLowerCase();

        const filtered = bars.filter(b => {
            const matchRegion = (r === 'all') || (r === '新北市' ? b.r.includes('新北') : b.r.includes(r));
            const matchPurpose = (p === 'all') || b.p.includes(p) || (p === '約會' && b.note.includes('約會'));
            const matchType = (t === 'all') || 
                              (t === '日本調酒師' && b.note.includes('日本調酒師')) ||
                              (t === '下午' && b.note.includes('下午')) ||
                              (t === '便宜' && b.note.includes('便宜')) ||
                              b.t.includes(t);
            const matchSearch = !q || b.n.toLowerCase().includes(q) || b.note.toLowerCase().includes(q) || b.r.toLowerCase().includes(q);
            
            return matchRegion && matchPurpose && matchType && matchSearch;
        });

        countDisplay.innerText = `搜尋到 ${filtered.length} 間適合的酒吧`;
        grid.innerHTML = filtered.map(b => `
            <div class="bar-card">
                ${b.s ? '<span class="special-badge">⭐ 私心推薦</span>' : ''}
                <div class="bar-name">${b.n}</div>
                <div class="bar-info">${b.r} | ${b.t}</div>
                <div class="bar-tags">
                    ${b.p.split('或').map(txt => `<span class="tag">${txt.trim()}</span>`).join('')}
                    ${b.note.includes('日本調酒師') ? '<span class="tag tag-highlight">🇯🇵 日本調酒師</span>' : ''}
                    ${b.note.includes('茶') ? '<span class="tag">🍵 茶酒</span>' : ''}
                </div>
                <div class="bar-note">${b.note}</div>
            </div>
        `).join('');
    }

    document.querySelectorAll('select, input').forEach(el => el.addEventListener('input', update));
    update();
</script>
