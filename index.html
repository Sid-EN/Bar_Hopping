<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台灣微醺指南 | TAIWAN BAR BIBLE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
    <style>
        :root { --gold: #d4af37; --dark: #121212; --card: #1e1e1e; --text: #e0e0e0; --muted: #888; --line: #333;
                --open: #5ac77f; --closed: #d96a6a; --want: #ff6b8a; --visited: #5ac77f; }
        * { box-sizing: border-box; }
        body { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; background: var(--dark); color: var(--text); margin: 0; padding: 20px 20px 90px; line-height: 1.6; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { text-align: center; padding: 36px 0 24px; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
        h1 { color: var(--gold); letter-spacing: 3px; margin: 0; font-size: 2rem; }
        .subtitle { color: var(--muted); margin-top: 10px; }

        /* 工具列：檢視切換與進度 */
        .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 20px; }
        .view-switch { display: flex; background: var(--card); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
        .view-switch button { background: transparent; border: none; color: var(--muted); padding: 8px 20px; cursor: pointer; font-size: 0.9rem; font-family: inherit; transition: 0.2s; }
        .view-switch button.active { background: var(--gold); color: #000; font-weight: bold; }
        .progress-wrap { flex: 1; min-width: 200px; max-width: 340px; }
        .progress-label { font-size: 0.78rem; color: var(--muted); display: flex; justify-content: space-between; margin-bottom: 4px; }
        .progress-bar { height: 6px; background: #2c2c2c; border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--visited)); transition: width 0.4s; }

        /* 縣市分區頁籤 */
        .city-nav { margin-bottom: 24px; }
        .region-row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
        .region-label { flex: 0 0 74px; color: var(--muted); font-size: 0.8rem; letter-spacing: 2px; text-align: right; padding-right: 4px; border-right: 2px solid var(--line); }
        .city-tabs { display: flex; flex-wrap: wrap; gap: 8px; }
        .city-tab { background: var(--card); border: 1px solid var(--line); color: var(--text); padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 0.9rem; transition: 0.2s; white-space: nowrap; font-family: inherit; }
        .city-tab:hover { border-color: var(--gold); color: var(--gold); }
        .city-tab.active { background: var(--gold); color: #000; border-color: var(--gold); font-weight: bold; }
        .city-tab .cnt { font-size: 0.75rem; opacity: 0.65; margin-left: 4px; }

        /* 篩選區 */
        .filter-panel { background: var(--card); padding: 20px 25px; border-radius: 15px; display: grid; grid-template-columns: repeat(auto-fit, minmax(175px, 1fr)); gap: 16px; margin-bottom: 20px; border: 1px solid var(--line); }
        .filter-group label { display: block; color: var(--gold); font-size: 0.85rem; margin-bottom: 8px; font-weight: bold; }
        select, input[type=text] { width: 100%; padding: 11px 12px; background: #2c2c2c; border: 1px solid #444; color: #fff; border-radius: 8px; outline: none; font-size: 0.9rem; font-family: inherit; }
        input:focus, select:focus { border-color: var(--gold); }

        /* 酒吧列表 */
        .result-count { margin-bottom: 16px; color: var(--muted); font-size: 0.9rem; }
        .bar-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .bar-card { background: var(--card); border-radius: 12px; padding: 20px; border: 1px solid #2c2c2c; transition: 0.3s; position: relative; display: flex; flex-direction: column; cursor: pointer; }
        .bar-card:hover, .bar-card:focus-visible { transform: translateY(-5px); border-color: var(--gold); box-shadow: 0 10px 20px rgba(0,0,0,0.5); outline: none; }
        .bar-card.in-route { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset; }

        .badge-row { position: absolute; top: 15px; right: 15px; display: flex; flex-direction: column; gap: 5px; align-items: flex-end; }
        .special-badge { background: var(--gold); color: #000; font-size: 0.7rem; padding: 3px 8px; border-radius: 4px; font-weight: bold; }
        .award-badge { background: #3a1c4f; color: #d9b8ff; border: 1px solid #7e57c2; font-size: 0.7rem; padding: 3px 8px; border-radius: 4px; font-weight: bold; }
        .status-badge { background: #4a1c1c; color: #ff9a9a; border: 1px solid #a33; font-size: 0.7rem; padding: 3px 8px; border-radius: 4px; font-weight: bold; }
        .bar-card.is-closed { opacity: 0.6; }
        .bar-card.is-closed .bar-name { color: #999; }
        .bar-name { font-size: 1.25rem; font-weight: bold; color: var(--gold); margin-right: 92px; }
        .bar-info { font-size: 0.85rem; color: #aaa; margin: 8px 0; }
        .price { color: var(--gold); letter-spacing: 1px; }
        .price .off { color: #555; }
        .bar-tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
        .tag { background: #333; color: #ccc; font-size: 0.75rem; padding: 3px 10px; border-radius: 20px; }
        .tag-highlight { background: #4a3700; color: #ffcc00; }
        .tag-friend { background: #4f2a1c; color: #ffb28a; }
        .tag-award { background: #3a1c4f; color: #d9b8ff; }
        .bar-note { font-size: 0.9rem; color: #bbb; border-top: 1px solid var(--line); padding-top: 12px; margin-top: auto; }
        .bar-details { font-size: 0.8rem; color: var(--muted); margin-top: 10px; display: flex; flex-direction: column; gap: 4px; }

        /* 營業狀態 */
        .open-pill { display: inline-flex; align-items: center; gap: 5px; font-size: 0.78rem; padding: 2px 10px; border-radius: 20px; font-weight: bold; }
        .open-pill.open { background: rgba(90,199,127,0.15); color: var(--open); }
        .open-pill.soon { background: rgba(212,175,55,0.15); color: var(--gold); }
        .open-pill.closed { background: rgba(217,106,106,0.13); color: var(--closed); }
        .open-pill.unknown { background: #2c2c2c; color: var(--muted); }

        /* Google 五星 */
        .rating-row { display: flex; align-items: center; gap: 6px; }
        .stars { position: relative; display: inline-block; color: #4a4a4a; font-size: 0.95rem; line-height: 1; letter-spacing: 0; }
        .stars::before { content: '\2605\2605\2605\2605\2605'; }
        .stars-fill { position: absolute; top: 0; left: 0; overflow: hidden; white-space: nowrap; color: #f5c518; }
        .stars-fill::before { content: '\2605\2605\2605\2605\2605'; }
        .rating-num { color: #f5c518; font-weight: bold; }
        .rating-count { color: var(--muted); }
        .budget { color: #9fd4a3; }

        /* 動作按鈕 */
        .bar-actions { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .btn { display: inline-block; background: transparent; border: 1px solid var(--gold); color: var(--gold); font-size: 0.8rem; padding: 6px 14px; border-radius: 20px; text-decoration: none; transition: 0.2s; cursor: pointer; font-family: inherit; }
        .btn:hover { background: var(--gold); color: #000; }
        .btn-ghost { border-color: #555; color: #aaa; }
        .btn-ghost:hover { background: #555; color: #fff; }
        .icon-btn { background: transparent; border: 1px solid var(--line); color: var(--muted); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 0.95rem; line-height: 1; display: inline-flex; align-items: center; justify-content: center; transition: 0.2s; padding: 0; font-family: inherit; }
        .icon-btn:hover { border-color: var(--gold); color: var(--gold); }
        .icon-btn.on-want { border-color: var(--want); color: var(--want); background: rgba(255,107,138,0.12); }
        .icon-btn.on-visited { border-color: var(--visited); color: var(--visited); background: rgba(90,199,127,0.12); }
        .icon-btn.on-route { border-color: var(--gold); color: #000; background: var(--gold); }
        .my-rating { color: var(--gold); font-size: 0.78rem; }

        .empty { text-align: center; color: var(--muted); padding: 60px 0; }
        footer { text-align: center; color: #555; font-size: 0.75rem; margin-top: 50px; padding-top: 20px; border-top: 1px solid var(--line); }

        /* 地圖 */
        #mapView { display: none; }
        #mapView.active { display: block; }
        #map { height: 62vh; min-height: 420px; border-radius: 14px; border: 1px solid var(--line); background: #1a1a1a; }
        .map-note { font-size: 0.8rem; color: var(--muted); margin-top: 10px; text-align: center; }
        .leaflet-popup-content-wrapper { background: var(--card); color: var(--text); border-radius: 10px; }
        .leaflet-popup-tip { background: var(--card); }
        .leaflet-popup-content { margin: 12px 14px; font-family: inherit; }
        .popup-name { color: var(--gold); font-weight: bold; font-size: 1rem; }
        .popup-meta { color: #aaa; font-size: 0.8rem; margin: 4px 0 8px; }
        .map-legend { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; margin-top: 12px; font-size: 0.78rem; color: var(--muted); }
        .map-legend span { display: inline-flex; align-items: center; gap: 5px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

        /* 詳細頁 Modal */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.82); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 1000; }
        .modal-overlay[hidden] { display: none; }
        .modal { background: var(--card); border: 1px solid var(--gold); border-radius: 16px; max-width: 640px; width: 100%; max-height: 88vh; overflow-y: auto; position: relative; padding: 28px; box-shadow: 0 20px 50px rgba(0,0,0,0.7); }
        .modal-close { position: absolute; top: 14px; right: 16px; background: transparent; border: none; color: var(--muted); font-size: 1.8rem; line-height: 1; cursor: pointer; padding: 4px 8px; border-radius: 6px; }
        .modal-close:hover { color: var(--gold); background: #2c2c2c; }
        .modal-title { color: var(--gold); font-size: 1.6rem; font-weight: bold; margin: 0 40px 6px 0; }
        .modal-meta { color: #aaa; font-size: 0.9rem; margin-bottom: 14px; }
        .modal-note { background: #262626; border-left: 3px solid var(--gold); padding: 12px 16px; border-radius: 0 8px 8px 0; margin: 16px 0; color: #ccc; font-size: 0.92rem; }
        .modal-rows { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; font-size: 0.88rem; margin: 16px 0; align-items: start; }
        .modal-rows dt { color: var(--gold); white-space: nowrap; }
        .modal-rows dd { margin: 0; color: #ccc; }
        .modal-awards { list-style: none; padding: 0; margin: 16px 0; display: flex; flex-direction: column; gap: 6px; }
        .modal-awards li { background: #3a1c4f; color: #d9b8ff; font-size: 0.82rem; padding: 6px 12px; border-radius: 6px; }
        .modal-map { width: 100%; height: 260px; border: 1px solid var(--line); border-radius: 10px; margin-top: 8px; background: #222; }
        .modal-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
        .modal-section-label { color: var(--muted); font-size: 0.78rem; letter-spacing: 1px; margin-top: 18px; }
        .my-rate-row { display: flex; align-items: center; gap: 10px; background: #262626; padding: 12px 16px; border-radius: 10px; margin: 14px 0; flex-wrap: wrap; }
        .rate-stars button { background: transparent; border: none; color: #4a4a4a; font-size: 1.35rem; cursor: pointer; padding: 0 2px; line-height: 1; }
        .rate-stars button.lit { color: var(--gold); }

        /* 今晚路線（底部固定列） */
        .route-bar { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(24,24,24,0.97); border-top: 1px solid var(--gold); padding: 12px 20px; z-index: 900; backdrop-filter: blur(6px); }
        .route-bar[hidden] { display: none; }
        .route-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
        .route-title { color: var(--gold); font-weight: bold; font-size: 0.9rem; white-space: nowrap; }
        .route-chips { display: flex; gap: 8px; flex-wrap: wrap; flex: 1; min-width: 200px; }
        .route-chip { background: #2c2c2c; border: 1px solid var(--line); border-radius: 20px; padding: 4px 10px 4px 12px; font-size: 0.8rem; display: inline-flex; align-items: center; gap: 6px; }
        .route-chip .seq { color: var(--gold); font-weight: bold; }
        .route-chip button { background: transparent; border: none; color: var(--muted); cursor: pointer; font-size: 1rem; line-height: 1; padding: 0; }
        .route-chip button:hover { color: var(--closed); }
        .route-dist { color: var(--muted); font-size: 0.78rem; white-space: nowrap; }

        @media (max-width: 600px) {
            body { padding: 16px 16px 110px; }
            .filter-panel { grid-template-columns: 1fr; }
            .region-row { flex-direction: column; gap: 6px; }
            .region-label { flex: none; text-align: left; border-right: none; border-bottom: 1px solid var(--line); padding: 0 0 2px; width: 100%; }
            .city-tabs { overflow-x: auto; flex-wrap: nowrap; padding-bottom: 4px; }
            .modal { padding: 22px 18px; max-height: 92vh; }
            .modal-rows { grid-template-columns: 1fr; gap: 2px; }
            .modal-rows dt { margin-top: 8px; }
            .toolbar { justify-content: center; }
            #map { height: 55vh; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>TAIWAN BAR BIBLE</h1>
        <div class="subtitle" id="subtitle">全台酒友、脆友、老酒鬼推薦清單</div>
    </header>

    <div class="toolbar">
        <div class="view-switch">
            <button id="viewList" class="active">📋 清單</button>
            <button id="viewMap">🗺️ 地圖</button>
        </div>
        <div class="progress-wrap">
            <div class="progress-label"><span>🍸 已攻略</span><span id="progressText">0 / 0</span></div>
            <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
        </div>
    </div>

    <nav class="city-nav" id="cityNav"></nav>

    <div class="filter-panel">
        <div class="filter-group">
            <label>📍 行政區</label>
            <select id="districtFilter"><option value="all">所有行政區</option></select>
        </div>
        <div class="filter-group">
            <label>🎯 聚會目的</label>
            <select id="purposeFilter">
                <option value="all">所有目的</option>
                <option value="一個人">一個人安靜</option>
                <option value="聚會">多人聚會</option>
                <option value="約會">適合約會</option>
            </select>
        </div>
        <div class="filter-group">
            <label>🍸 酒類與亮點</label>
            <select id="typeFilter">
                <option value="all">所有類型</option>
                <option value="經典">經典調酒</option>
                <option value="特調">創意特調</option>
                <option value="啤酒">啤酒</option>
                <option value="日本調酒師">日本調酒師</option>
                <option value="下午">下午就開喝</option>
                <option value="便宜">高 CP 值/便宜</option>
                <option value="獲獎">🏆 獲獎名店</option>
                <option value="脆友">🧡 脆友推薦</option>
            </select>
        </div>
        <div class="filter-group">
            <label>💰 價位</label>
            <select id="priceFilter">
                <option value="all">所有價位</option>
                <option value="1">$ 平價</option>
                <option value="2">$$ 中等</option>
                <option value="3">$$$ 高消費</option>
            </select>
        </div>
        <div class="filter-group">
            <label>🕒 狀態</label>
            <select id="stateFilter">
                <option value="all">全部</option>
                <option value="open">現在還有開</option>
                <option value="want">❤️ 我的收藏</option>
                <option value="visited">✓ 已喝過</option>
                <option value="unvisited">尚未喝過</option>
            </select>
        </div>
        <div class="filter-group">
            <label>↕️ 排序方式</label>
            <select id="sortFilter">
                <option value="default">預設（依縣市）</option>
                <option value="award">🏆 獲獎與推薦優先</option>
                <option value="rating">★ Google 評分高到低</option>
                <option value="price-asc">💰 價位由低到高</option>
                <option value="name">🔤 店名排序</option>
            </select>
        </div>
        <div class="filter-group">
            <label>🔍 關鍵字搜尋</label>
            <input type="text" id="searchInput" placeholder="搜尋：店名、拉麵、貓、茶酒...">
        </div>
    </div>

    <div class="result-count" id="resultCount">正在載入清單...</div>
    <div class="bar-grid" id="barGrid"></div>

    <div id="mapView">
        <div id="map"></div>
        <div class="map-legend">
            <span><i class="dot" style="background:#b388ff"></i>獲獎名店</span>
            <span><i class="dot" style="background:#d4af37"></i>私心推薦</span>
            <span><i class="dot" style="background:#5ac77f"></i>已喝過</span>
            <span><i class="dot" style="background:#ff6b8a"></i>我的收藏</span>
            <span><i class="dot" style="background:#8a8a8a"></i>其他</span>
        </div>
        <div class="map-note" id="mapNote"></div>
    </div>

    <footer>酒吧資訊（評分、營業時間等）為整理時之參考值，出發前請以店家公告為準｜未成年請勿飲酒 🍸 酒後不開車</footer>
</div>

<div class="modal-overlay" id="modalOverlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <button class="modal-close" id="modalClose" aria-label="關閉">&times;</button>
        <div id="modalContent"></div>
    </div>
</div>

<div class="route-bar" id="routeBar" hidden>
    <div class="route-inner">
        <span class="route-title">🍺 今晚路線</span>
        <div class="route-chips" id="routeChips"></div>
        <span class="route-dist" id="routeDist"></span>
        <a class="btn" id="routeGo" href="#" target="_blank" rel="noopener">🚕 開始導航</a>
        <button class="btn btn-ghost" id="routeClear">清空</button>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
